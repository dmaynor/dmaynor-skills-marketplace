name: Validate marketplace

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate marketplace structure
        run: python3 scripts/validate_marketplace.py
      - name: Compile Python helpers
        run: python3 -m compileall -q plugins scripts
      - name: Test walkthrough verifier
        run: python3 -m unittest discover -s plugins/repeatable-demo-evidence/skills/repeatable-demo-evidence/scripts -p 'test_*.py'
      - name: Check shell syntax
        run: find plugins -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
